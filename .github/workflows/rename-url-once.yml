name: One-time LP URL migration

on:
  push:
    branches:
      - chore/rename-keiei-handan-url

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/rename-keiei-handan-url
          fetch-depth: 0

      - name: Replace old GitHub Pages URL
        shell: bash
        run: |
          set -euo pipefail
          old='https://takatrp.github.io/matsumoto-kaikei-jidouka/'
          new='https://takatrp.github.io/matsumoto-kaikei-keiei-handan/'

          mapfile -t files < <(git grep -Il 'matsumoto-kaikei-jidouka' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No old URL references found.'
          else
            python3 - "$old" "$new" "${files[@]}" <<'PY'
          import pathlib
          import sys

          old, new, *files = sys.argv[1:]
          for name in files:
              path = pathlib.Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new).replace('matsumoto-kaikei-jidouka', 'matsumoto-kaikei-keiei-handan')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'updated: {name}')
          PY
          fi

          if git grep -n 'matsumoto-kaikei-jidouka' -- ':!*.lock'; then
            echo 'Old repository name still remains.' >&2
            exit 1
          fi

          grep -q 'https://takatrp.github.io/matsumoto-kaikei-keiei-handan/' index.html
          grep -q "G-XX3J7H4NF1" index.html

      - name: Validate HTML and optional project checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              pass

          text = Path('index.html').read_text(encoding='utf-8')
          Parser().feed(text)
          for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, flags=re.S):
              json.loads(block)
          assert 'https://takatrp.github.io/matsumoto-kaikei-keiei-handan/' in text
          assert 'matsumoto-kaikei-jidouka' not in text
          assert 'G-XX3J7H4NF1' in text
          print('HTML and JSON-LD validation passed')
          PY

          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
            npm test --if-present
            npm run build --if-present
          fi

          git diff --check

      - name: Remove one-time workflow and commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rename-url-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Update LP URLs for renamed repository'
          git push origin HEAD:chore/rename-keiei-handan-url
